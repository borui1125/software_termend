<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>帳號審核管理 - 管院小幫手</title>
    <style>
        body { font-family: "Noto Sans TC", sans-serif; margin: 0; background: #f3f6fb; color: #17283e; }
        .container { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; }
        .card { background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #475569; }
        .badge { padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
        .pending { background: #fef3c7; color: #b45309; }
        .approved { background: #dcfce7; color: #15803d; }
        .rejected { background: #fee2e2; color: #b91c1c; }
        button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .btn-approve { background: #16a34a; color: #fff; }
        .btn-reject { background: #dc2626; color: #fff; }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <main class="container">
        <div class="card">
            <h2>帳號註冊審核與權限管理</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>帳號</th>
                        <th>信箱</th>
                        <th>角色</th>
                        <th>審核狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script>
        const currentUser = requireLogin();
        if (currentUser && currentUser.role_name !== "Admin") {
            alert("僅管理員可進入此頁面");
            window.location.href = "spaces.html";
        }
        renderNavbar("admin_users");

        async function loadUsers() {
            const res = await fetch(`${API_BASE}/admin/users`);
            const data = await res.json();
            const tbody = document.getElementById("userTableBody");
            tbody.innerHTML = "";

            (data.users || []).forEach(u => {
                const statusText = { pending: "待審核", approved: "已通過", rejected: "已退件" }[u.status] || u.status;
                tbody.innerHTML += `
                    <tr>
                        <td>${u.user_id}</td>
                        <td>${u.username}</td>
                        <td>${u.email}</td>
                        <td>
                            <select id="role_${u.user_id}">
                                <option value="1" ${u.role_id === 1 ? "selected" : ""}>Admin</option>
                                <option value="2" ${u.role_id === 2 ? "selected" : ""}>Teacher</option>
                                <option value="3" ${u.role_id === 3 ? "selected" : ""}>User</option>
                            </select>
                        </td>
                        <td><span class="badge ${u.status}">${statusText}</span></td>
                        <td>
                            <button class="btn-approve" onclick="reviewUser(${u.user_id}, 'approved')">通過</button>
                            <button class="btn-reject" onclick="reviewUser(${u.user_id}, 'rejected')">退件</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function reviewUser(userId, status) {
            const roleId = document.getElementById(`role_${userId}`).value;
            const res = await fetch(`${API_BASE}/admin/users/${userId}/review`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status, role_id: parseInt(roleId, 10) })
            });
            const data = await res.json();
            alert(data.message);
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
